<html lang="en">
<head>

</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Welcome to Our Website</h1>

<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(#852d21, #23897f,#77134d);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    background-color: rgb(243, 221, 221);
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    width: 90%;
    max-width: 400px;
    padding: 60px;
    overflow: hidden;
    animation: fadeIn 1s ease-in-out;
}

.content h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    color: #f997af;
}

.content p {
    font-size: 1rem;
    color: #555;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    justify-content: space-around;
}

.btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    background-color: #ff4d79;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.btn:hover {
    background-color: #ff758c;
    transform: translateY(-2px);
    box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
