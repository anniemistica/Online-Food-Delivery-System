<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
  <style>
    body {
      background: #f0f8ff;
      font-family: Arial, sans-serif;
    }

    .form-container {
      width: 350px;
      margin: 100px auto;
      padding: 20px;
      background: #ffffff;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Reservation Form</h2>
    <form method="post" action="submit.php">
      <input type="text" name="name" placeholder="Enter your name" required 
             pattern="[A-Za-z\s]+" minlength="3" maxlength="50"
             title="Only letters and spaces allowed.">
      
      <input type="tel" name="phone" placeholder="Enter phone number" required 
             pattern="[0-9]{10}" title="Enter 10 digit phone number only.">

      <input type="submit" value="Submit">
    </form>
  </div>

</body>
</html>
