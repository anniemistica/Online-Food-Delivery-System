<center>
  <table border="1" cellspacing="20" cellpadding="10" 
         style="background-color: lightyellow; border-collapse: collapse;">
    <tr style="background-color: lightblue;">
      <th>Item</th>
      <th>Price</th>
      <th>Quantity</th>
    </tr>
    <tr style="background-color: white;" 
        onmouseover="this.style.backgroundColor='lightgreen'" 
        onmouseout="this.style.backgroundColor='white'">
      <td>Apple</td>
      <td>$1</td>
      <td>5</td>
    </tr>
    <tr style="background-color: white;" 
        onmouseover="this.style.backgroundColor='lightgreen'" 
        onmouseout="this.style.backgroundColor='white'">
      <td>Banana</td>
      <td>$0.5</td>
      <td>10</td>
    </tr>
  </table>
</center>
